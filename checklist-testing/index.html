    /*
      Checklist Testing (page 172): a test bench for working with Art Checklists outside the Quickbase forms.
        Find    a checklist by part of its description, its related order number, or its own number.
        Tasks   shown by department and by done / not done. A task is done when its Review is Yes, No or N/A,
                which is the same rule Quickbase uses (the Complete field).
        Timers  start one (adds a Time Entry on the checklist), stop it (ticks Closed on that entry, as Quickbase's
                Stop button does), and Re-Start it (presses Quickbase's own Re-Start button; the clock carries
                on from the time already logged rather than starting again at zero).
      Everything runs as the signed-in person; nothing is stored here.
    */
    const REALM = 'demo.quickbase.example', APP = 'bdemoapp0';
    const LISTS = {table: 'bdemolist', description: 13, order: 10, po: 19, brandId: 17, brand: 18, template: 14, assigned: 25, total: 21, open: 30, times: 29, isTemplate: 16};
    const TASKS = {table: 'bdemotask', list: 12, number: 18, sort: 32, department: 27, section: 26, description: 28, info: 29, review: 14, notes: 15, complete: 16, inactive: 34};
    const TIMES = {table: 'bdemotime', start: 1, end: 2, customer: 6, serviceId: 8, service: 9, category: 10, order: 11, override: 13, hours: 14, closed: 15, button: 16, employee: 17, employeeName: 18, notes: 19, recent: 20, list: 21};
    const SERVICES = {table: 'bdemosrvc', category: 6, name: 7};
    const DEPARTMENTS = ['Prepress', 'Proofreading', 'PC', 'Engineering'];
    // The timer category that goes with each task department, and the service picked first for it.
    const TIMER_FOR = {Prepress: ['Prepress', 'Production Art - New Art'], Proofreading: ['Prepress', 'Routing & Proof-reading art'], PC: ['Project Coordinator', 'Internal Routing & Review'], Engineering: ['Engineering', '']};
    const TEST_CHECKLIST = '1019';

    const $ = selector => document.querySelector(selector);
    const esc = text => String(text == null ? '' : text).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
    const rid = value => String(value || '').replace(/\.0+$/, '');
    const state = {list: null, tasks: [], times: [], services: [], me: {id: '', name: ''}, department: '', status: 'todo', mine: []};

    // ---------- Quickbase, as the signed-in person ----------
    const xml = text => new DOMParser().parseFromString(text, 'text/xml');
    let appToken = null;
    async function variable(name) {
      const doc = xml(await (await fetch(`https://${REALM}/db/${APP}?${new URLSearchParams({a: 'API_GetDBVar', varname: name})}`, {credentials: 'include'})).text());
      return (doc.querySelector('value')?.textContent || '').trim();
    }
    // Sends one API call. If the app asks for its application token, that is read from the app's own variables and
    // the call is sent again; the person's own sign-in still decides what they are allowed to do.
    async function qb(table, params) {
      const send = async extra => {
        const response = await fetch(`https://${REALM}/db/${table}?${new URLSearchParams({...params, ...extra})}`, {credentials: 'include'});
        if (!response.ok) throw new Error(`Quickbase request failed (${response.status}).`);
        return xml(await response.text());
      };
      let doc = await send(appToken ? {apptoken: appToken} : {});
      let code = (doc.querySelector('errcode')?.textContent || '').trim();
      if (code && code !== '0' && !appToken) {
        try { appToken = await variable('q_apptoken'); } catch (ignored) {}
        if (appToken) { doc = await send({apptoken: appToken}); code = (doc.querySelector('errcode')?.textContent || '').trim(); }
      }
      if (code && code !== '0') {
        const text = `${(doc.querySelector('errtext')?.textContent || 'Quickbase error').trim()} ${(doc.querySelector('errdetail')?.textContent || '').trim()}`.trim();
        throw new Error(code === '4' || code === '22' ? 'Open this page from Quickbase while signed in.' : text);
      }
      return doc;
    }
    const decoder = document.createElement('textarea');
    function clean(value) { const text = String(value || '').trim(); if (!/[<&]/.test(text)) return text; decoder.innerHTML = text.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ''); return decoder.value.replace(/\s+/g, ' ').trim(); }
    async function query(table, where, fids, options) {
      const doc = await qb(table, {a: 'API_DoQuery', query: where, clist: fids.join('.'), fmt: 'structured', ...(options ? {options} : {})});
      return [...doc.querySelectorAll('record')].map(record => { const row = {}; record.querySelectorAll('f').forEach(f => { row[f.getAttribute('id')] = clean(f.textContent); }); return row; });
    }
    const quote = value => String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

    let statusTimer = 0;
    function say(text, kind) {
      const status = $('#status');
      clearTimeout(statusTimer);
      status.textContent = text; status.className = 'status' + (kind ? ' ' + kind : ''); status.hidden = !text;
      if (text && kind !== 'bad') statusTimer = setTimeout(() => { status.hidden = true; }, kind === 'good' ? 2600 : 8000);
    }

    // ---------- Find a checklist ----------
    const LIST_FIELDS = [3, LISTS.description, LISTS.order, LISTS.po, LISTS.brandId, LISTS.brand, LISTS.template, LISTS.assigned, LISTS.total, LISTS.open, LISTS.times];
    let searchSeq = 0, searchDelay = 0;
    async function search() {
      const text = $('#search').value.trim(), seq = ++searchSeq, note = $('#searchNote');
      if (!text) { $('#results').innerHTML = ''; note.textContent = 'Type part of a description, an order number, or a checklist number.'; return; }
      note.textContent = 'Searching…';
      const number = /^\d+$/.test(text) ? text : '';
      // A number can be the checklist itself or its order; any text is looked for inside the description.
      const where = `(${[number && `{3.EX.'${number}'}`, number && `{${LISTS.order}.EX.'${number}'}`, `{${LISTS.description}.CT.'${quote(text)}'}`].filter(Boolean).join('OR')})AND{${LISTS.description}.XCT.'[TEMPLATE]'}`;
      try {
        const rows = await query(LISTS.table, where, LIST_FIELDS, 'num-60.sortorder-D');
        if (seq !== searchSeq) return;
        const why = row => number && rid(row[3]) === number ? 'checklist #' : number && rid(row[LISTS.order]) === number ? 'order #' : 'description';
        rows.sort((a, b) => (why(a) === 'checklist #' ? 0 : why(a) === 'order #' ? 1 : 2) - (why(b) === 'checklist #' ? 0 : why(b) === 'order #' ? 1 : 2) || Number(b[3]) - Number(a[3]));
        note.textContent = rows.length ? `${rows.length}${rows.length === 60 ? '+' : ''} checklist${rows.length === 1 ? '' : 's'}` : 'No checklist matches that.';
        $('#results').innerHTML = rows.map(row => `<button type="button" class="result" data-rid="${esc(rid(row[3]))}" aria-current="${state.list && rid(state.list[3]) === rid(row[3])}">
          <b>${esc(row[LISTS.description] || '(no description)')}</b>
          <span>#${esc(rid(row[3]))}${row[LISTS.brand] ? ' · ' + esc(row[LISTS.brand]) : ''}${rid(row[LISTS.order]) ? ' · Order ' + esc(rid(row[LISTS.order])) : ''}</span>
          <span><span class="hit">Matched ${why(row)}</span> · ${Number(row[LISTS.total] || 0) - Number(row[LISTS.open] || 0)}/${Number(row[LISTS.total] || 0)} done</span></button>`).join('');
      } catch (error) { if (seq === searchSeq) { note.textContent = error.message; $('#results').innerHTML = ''; } }
    }
    $('#search').addEventListener('input', () => { clearTimeout(searchDelay); searchDelay = setTimeout(search, 250); });
    $('#results').addEventListener('click', event => { const button = event.target.closest('[data-rid]'); if (button) openChecklist(button.dataset.rid); });

    // ---------- Open a checklist ----------
    async function openChecklist(id) {
      say(`Opening checklist ${id}…`);
      try {
        const [lists, tasks] = await Promise.all([
          query(LISTS.table, `{3.EX.'${quote(id)}'}`, LIST_FIELDS),
          query(TASKS.table, `{${TASKS.list}.EX.'${quote(id)}'}`, [3, TASKS.number, TASKS.sort, TASKS.department, TASKS.section, TASKS.description, TASKS.info, TASKS.review, TASKS.notes, TASKS.inactive], 'num-500')
        ]);
        if (!lists.length) { say(`There is no checklist ${id}.`, 'bad'); return; }
        state.list = lists[0];
        state.tasks = tasks.sort((a, b) => Number(a[TASKS.sort] || 0) - Number(b[TASKS.sort] || 0) || Number(a[3]) - Number(b[3]));
        const live = state.tasks.filter(task => task[TASKS.inactive] !== '1');
        if (!live.some(task => task[TASKS.department] === state.department)) state.department = DEPARTMENTS.find(name => live.some(task => task[TASKS.department] === name && !task[TASKS.review])) || DEPARTMENTS.find(name => live.some(task => task[TASKS.department] === name)) || '';
        try { localStorage.setItem('cl-testing-last', id); } catch (ignored) {}
        const here = new URL(location.href); here.searchParams.set('checklist', id); history.replaceState(null, '', here);
        document.querySelectorAll('.result').forEach(button => button.setAttribute('aria-current', String(button.dataset.rid === id)));
        $('#blank').hidden = true;
        renderHead(); renderTasks(); pickTimerDefaults();
        await loadTimes();
        say('');
      } catch (error) { say(error.message, 'bad'); }
    }
    function renderHead() {
      const list = state.list, live = state.tasks.filter(task => task[TASKS.inactive] !== '1'), done = live.filter(task => task[TASKS.review]).length;
      const percent = live.length ? Math.round(done / live.length * 100) : 0;
      $('#head').innerHTML = `<div><p class="eyebrow">Art checklist #${esc(rid(list[3]))}</p><h1>${esc(list[LISTS.description] || '(no description)')}</h1>
        <div class="facts">${list[LISTS.brand] ? `<span>Brand <b>${esc(list[LISTS.brand])}</b></span>` : ''}<span>Order <b>${esc(rid(list[LISTS.order]) || 'none')}</b></span>${list[LISTS.po] ? `<span>PO <b>${esc(list[LISTS.po])}</b></span>` : ''}${list[LISTS.template] ? `<span>Template <b>${esc(list[LISTS.template])}</b></span>` : ''}<span>Assigned to <b>${esc(list[LISTS.assigned] || 'nobody')}</b></span></div></div>
        <div class="head-side"><div class="progress"><div class="progress-bar"><i style="width:${percent}%"></i></div><small>${done} of ${live.length} tasks done</small></div>
        <a href="https://${REALM}/db/${LISTS.table}?a=dr&rid=${esc(rid(list[3]))}" target="_blank" rel="noopener">Open in Quickbase</a></div>`;
      $('#head').hidden = false;
    }

    // ---------- Tasks, by department and by done / not done ----------
    function renderTasks() {
      const live = state.tasks.filter(task => task[TASKS.inactive] !== '1'), hidden = state.tasks.length - live.length;
      const names = [...DEPARTMENTS.filter(name => live.some(task => task[TASKS.department] === name)), ...new Set(live.map(task => task[TASKS.department]).filter(name => !DEPARTMENTS.includes(name)))];
      $('#tabs').innerHTML = names.map(name => {
        const mine = live.filter(task => task[TASKS.department] === name), done = mine.filter(task => task[TASKS.review]).length;
        return `<button type="button" class="tab${done === mine.length ? ' all-done' : ''}" data-department="${esc(name)}" aria-pressed="${name === state.department}">${esc(name || 'No department')} <small>${done}/${mine.length}</small></button>`;
      }).join('');
      document.querySelectorAll('#statusFilter button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.status === state.status)));
      const shown = live.filter(task => task[TASKS.department] === state.department && (state.status === 'all' || (state.status === 'done') === Boolean(task[TASKS.review])));
      let section = null, html = '';
      for (const task of shown) {
        if (task[TASKS.section] !== section) { section = task[TASKS.section]; html += `<div class="section">${esc(section || 'Other')}</div>`; }
        html += `<div class="task${task[TASKS.review] ? ' done' : ''}" data-task="${esc(rid(task[3]))}">
          <span class="num">${esc(rid(task[TASKS.number]) || rid(task[TASKS.sort]))}</span>
          <div class="text"><b>${esc(task[TASKS.description])}</b>${task[TASKS.info] ? `<small>${esc(task[TASKS.info])}</small>` : ''}</div>
          <div class="review" role="group" aria-label="Review">${['Yes', 'No', 'N/A'].map(value => `<button type="button" data-value="${value}" aria-pressed="${task[TASKS.review] === value}">${value}</button>`).join('')}</div>
          <textarea placeholder="Notes" aria-label="Notes">${esc(task[TASKS.notes])}</textarea></div>`;
      }
      const all = live.filter(task => task[TASKS.department] === state.department).length;
      $('#taskList').innerHTML = (html || `<div class="empty">${!all ? 'No tasks in this department.' : state.status === 'todo' ? 'Everything in this department is done.' : 'Nothing is done in this department yet.'}</div>`) +
        (hidden ? `<p class="muted" style="margin:14px 0 0;font-size:13px">${hidden} Engineering task${hidden === 1 ? ' is' : 's are'} hidden because this checklist is marked Engineering N/A.</p>` : '');
      $('#tasks').hidden = false;
    }
    $('#tabs').addEventListener('click', event => { const tab = event.target.closest('[data-department]'); if (!tab) return; state.department = tab.dataset.department; renderTasks(); pickTimerDefaults(); });
    $('#statusFilter').addEventListener('click', event => { const button = event.target.closest('[data-status]'); if (!button) return; state.status = button.dataset.status; renderTasks(); });

    // Clicking Yes / No / N/A saves the Review; clicking the chosen one again clears it (back to not done).
    $('#taskList').addEventListener('click', async event => {
      const button = event.target.closest('.review button'); if (!button) return;
      const row = button.closest('[data-task]'), task = state.tasks.find(item => rid(item[3]) === row.dataset.task), value = task[TASKS.review] === button.dataset.value ? '' : button.dataset.value;
      row.querySelectorAll('.review button').forEach(other => { other.disabled = true; });
      try {
        await qb(TASKS.table, {a: 'API_EditRecord', rid: row.dataset.task, [`_fid_${TASKS.review}`]: value});
        task[TASKS.review] = value;
        renderHead(); renderTasks();
        say(value ? `Task ${rid(task[TASKS.number]) || ''} marked ${value}.` : 'Review cleared.', 'good');
      } catch (error) { say(`That did not save: ${error.message}`, 'bad'); row.querySelectorAll('.review button').forEach(other => { other.disabled = false; }); }
    });
    $('#taskList').addEventListener('change', async event => {
      if (event.target.tagName !== 'TEXTAREA') return;
      const row = event.target.closest('[data-task]'), task = state.tasks.find(item => rid(item[3]) === row.dataset.task);
      try { await qb(TASKS.table, {a: 'API_EditRecord', rid: row.dataset.task, [`_fid_${TASKS.notes}`]: event.target.value}); task[TASKS.notes] = event.target.value; say('Note saved.', 'good'); }
      catch (error) { say(`The note did not save: ${error.message}`, 'bad'); }
    });

    // ---------- Timers ----------
    const TIME_FIELDS = [3, TIMES.start, TIMES.end, TIMES.category, TIMES.service, TIMES.serviceId, TIMES.override, TIMES.hours, TIMES.closed, TIMES.employee, TIMES.employeeName, TIMES.notes, TIMES.list, TIMES.order];
    const clock = milliseconds => { const s = Math.max(0, Math.floor(milliseconds / 1000)); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
    const hoursText = hours => `${(Math.round(Number(hours || 0) * 100) / 100).toFixed(2)} h`;
    const isMine = entry => state.me.id && entry[TIMES.employee] === state.me.id;

    async function loadServices() {
      state.services = (await query(SERVICES.table, '{3.GT.0}', [3, SERVICES.category, SERVICES.name], 'num-500')).filter(row => row[SERVICES.name]);
      const used = ['Prepress', 'Project Coordinator', 'Engineering', 'Logistics'];
      const categories = [...used.filter(name => state.services.some(row => row[SERVICES.category] === name)), ...new Set(state.services.map(row => row[SERVICES.category]).filter(name => name && !used.includes(name)))];
      $('#category').innerHTML = categories.map(name => `<option>${esc(name)}</option>`).join('');
    }
    function fillServices(preferred) {
      const category = $('#category').value, options = state.services.filter(row => row[SERVICES.category] === category).sort((a, b) => a[SERVICES.name].localeCompare(b[SERVICES.name]));
      let remembered = ''; try { remembered = localStorage.getItem('cl-testing-service-' + category) || ''; } catch (ignored) {}
      const pick = options.find(row => row[SERVICES.name] === preferred) || options.find(row => rid(row[3]) === remembered) || options[0];
      $('#service').innerHTML = options.map(row => `<option value="${esc(rid(row[3]))}"${row === pick ? ' selected' : ''}>${esc(row[SERVICES.name])}</option>`).join('');
    }
    // The timer starts out matching the department tab being looked at.
    function pickTimerDefaults() {
      const [category, service] = TIMER_FOR[state.department] || [];
      if (category && [...$('#category').options].some(option => option.value === category)) $('#category').value = category;
      fillServices(service);
    }
    $('#category').addEventListener('change', () => fillServices(''));

    async function loadTimes() {
      state.times = (await query(TIMES.table, `{${TIMES.list}.EX.'${quote(rid(state.list[3]))}'}`, TIME_FIELDS, 'num-500')).sort((a, b) => Number(b[TIMES.start]) - Number(a[TIMES.start]));
      renderTimes();
      loadMine();
    }
    // One timer on screen = every time entry by the same person for the same service (and notes) on this checklist.
    // Quickbase keeps each start-to-stop stretch as its own entry; Re-Start adds another stretch. Shown together,
    // the clock carries on from the time already logged instead of starting again at zero.
    function timerGroups() {
      const groups = new Map();
      for (const entry of state.times) {
        const key = [entry[TIMES.employee], rid(entry[TIMES.serviceId]), entry[TIMES.category], entry[TIMES.notes]].join('|');
        if (!groups.has(key)) groups.set(key, {key, entries: []});
        groups.get(key).entries.push(entry);       // newest first, as state.times is
      }
      return [...groups.values()].map(group => {
        const open = group.entries.filter(entry => entry[TIMES.closed] !== '1' && !(Number(entry[TIMES.override]) > 0));
        const logged = group.entries.filter(entry => !open.includes(entry)).reduce((sum, entry) => sum + Number(entry[TIMES.hours] || 0), 0);
        return {...group, open, logged, latest: group.entries[0], first: group.entries[group.entries.length - 1]};
      });
    }
    const runningMs = group => group.logged * 3600000 + group.open.reduce((sum, entry) => sum + (Date.now() - Number(entry[TIMES.start])), 0);
    function renderTimes() {
      const groups = timerGroups(), total = groups.reduce((sum, group) => sum + runningMs(group), 0) / 3600000;
      $('#timerTotal').textContent = state.times.length ? `${hoursText(total)} logged on this checklist` : 'No time logged on this checklist yet.';
      $('#entries').innerHTML = groups.map(group => {
        const entry = group.latest, running = group.open.length > 0, mine = isMine(entry), stretches = group.entries.length;
        const when = stamp => new Date(Number(stamp)).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
        const detail = [entry[TIMES.employeeName] || 'Unknown', entry[TIMES.category], stretches > 1 ? `${stretches} sessions since ${when(group.first[TIMES.start])}` : `started ${when(entry[TIMES.start])}`,
                        running ? (stretches > 1 ? `this one since ${when(group.open[0][TIMES.start])}` : '') : `stopped ${when(entry[TIMES.end])}`, entry[TIMES.notes]].filter(Boolean);
        return `<li class="entry${running ? ' running' : ''}" data-group="${esc(group.key)}">
          ${running ? '<span class="dot" aria-hidden="true"></span>' : ''}
          <div class="what"><b>${esc(entry[TIMES.service] || entry[TIMES.category])}</b><span>${detail.map(esc).join(' \u00b7 ')}</span></div>
          <span class="clock"${running ? ` data-since="${esc(group.open.map(item => item[TIMES.start]).join(','))}" data-base="${Math.round(group.logged * 3600000)}"` : ''}>${clock(runningMs(group))}</span>
          ${running ? (mine ? '<button type="button" class="button stop small" data-stop>Stop</button>' : '<span class="muted" style="font-size:13px">running</span>') : (mine ? '<button type="button" class="button secondary small" data-again>Re-Start</button>' : '')}</li>`;
      }).join('');
      $('#timers').hidden = false;
    }
    // Running clocks: time already logged, plus the time since each open stretch began.
    setInterval(() => document.querySelectorAll('.clock[data-since]').forEach(node => {
      node.textContent = clock(Number(node.dataset.base || 0) + node.dataset.since.split(',').reduce((sum, start) => sum + (Date.now() - Number(start)), 0));
    }), 1000);

    async function startTimer(categoryName, serviceId, notes) {
      const list = state.list;
      if (!rid(list[LISTS.brandId])) { say('This checklist has no customer brand, and a time entry needs one. Set it in Quickbase first.', 'bad'); return; }
      if (!serviceId) { say('Pick a service first.', 'bad'); return; }
      // Starting the same service with the same notes again carries on that timer; anything else is a second timer.
      const same = timerGroups().find(group => isMine(group.latest) && rid(group.latest[TIMES.serviceId]) === String(serviceId) && group.latest[TIMES.category] === categoryName && (group.latest[TIMES.notes] || '') === (notes || ''));
      if (same && same.open.length) { say('That timer is already running.', ''); return; }
      if (!same && timerGroups().some(group => group.open.length && isMine(group.latest)) && !confirm('You already have a timer running on this checklist. Start another one as well?')) return;
      $('#startTimer').disabled = true;
      try {
        const fields = {[TIMES.list]: rid(list[3]), [TIMES.customer]: rid(list[LISTS.brandId]), [TIMES.category]: categoryName, [TIMES.serviceId]: serviceId, [TIMES.employee]: state.me.id, [TIMES.notes]: notes || ''};
        if (rid(list[LISTS.order])) fields[TIMES.order] = rid(list[LISTS.order]);
        await qb(TIMES.table, {a: 'API_AddRecord', ...Object.fromEntries(Object.entries(fields).map(([fid, value]) => [`_fid_${fid}`, value]))});
        try { localStorage.setItem('cl-testing-service-' + categoryName, serviceId); } catch (ignored) {}
        $('#timerNotes').value = '';
        await loadTimes();
        say('Timer started.', 'good');
      } catch (error) { say(`The timer did not start: ${error.message}`, 'bad'); }
      finally { $('#startTimer').disabled = false; }
    }
    async function stopTimer(entryId, button) {
      if (button) button.disabled = true;
      try {
        await qb(TIMES.table, {a: 'API_EditRecord', rid: entryId, [`_fid_${TIMES.closed}`]: '1'});
        if (state.list) await loadTimes(); else await loadMine();
        say('Timer stopped.', 'good');
      } catch (error) { say(`The timer did not stop: ${error.message}`, 'bad'); if (button) button.disabled = false; }
    }
    // Re-Start carries a stopped timer on. In Quickbase a time entry's start is the moment it was created and cannot
    // be moved, so reopening the old entry would also count the time it sat stopped. Instead this presses the
    // entry's own Re-Start button from Quickbase (the Stop/Restart field): a new entry with the same customer,
    // order, category, service and notes. On screen the two are one timer, and its clock carries on.
    // That button does not carry the checklist over, so the new entry is then tied to this checklist as well;
    // otherwise it would not appear here or on the checklist's own list of time entries.
    async function restartTimer(entry, button) {
      if (button) button.disabled = true;
      try {
        const found = await qb(TIMES.table, {a: 'API_DoQuery', query: `{3.EX.'${quote(rid(entry[3]))}'}`, clist: String(TIMES.button), fmt: 'structured'});
        const link = ((found.querySelector('record f')?.textContent || '').match(/href='([^']+)'/) || [])[1];
        if (!link || !/a=API_AddRecord/.test(link)) throw new Error('Quickbase is not showing a Re-Start button for that entry.');
        const url = new URL(link.replace(/&amp;/g, '&'));
        url.searchParams.delete('rdr');      // the button's redirect back to the table is not wanted here
        const answer = xml(await (await fetch(url, {credentials: 'include'})).text()), code = (answer.querySelector('errcode')?.textContent || '').trim();
        if (code !== '0') throw new Error(`${(answer.querySelector('errtext')?.textContent || 'Quickbase error').trim()} ${(answer.querySelector('errdetail')?.textContent || '').trim()}`.trim());
        const created = rid(answer.querySelector('rid')?.textContent);
        if (created && state.list) await qb(TIMES.table, {a: 'API_EditRecord', rid: created, [`_fid_${TIMES.list}`]: rid(state.list[3])});
        await loadTimes();
        say('Timer running again. It carries on from the time already logged.', 'good');
      } catch (error) { say(`The timer did not restart: ${error.message}`, 'bad'); if (button) button.disabled = false; }
    }
    $('#startTimer').addEventListener('click', () => startTimer($('#category').value, $('#service').value, $('#timerNotes').value.trim()));
    $('#entries').addEventListener('click', event => {
      const row = event.target.closest('[data-group]'); if (!row) return;
      const group = timerGroups().find(item => item.key === row.dataset.group); if (!group) return;
      const stop = event.target.closest('[data-stop]'), again = event.target.closest('[data-again]');
      if (stop) group.open.forEach(entry => stopTimer(rid(entry[3]), stop));
      else if (again) restartTimer(group.latest, again);
    });

    // Your own timers that are still running, on any checklist, so one is never left on by accident.
    async function loadMine() {
      if (!state.me.id) return;
      try {
        const open = (await query(TIMES.table, `{${TIMES.closed}.EX.'0'}AND{${TIMES.recent}.EX.'1'}`, TIME_FIELDS, 'num-300')).filter(isMine);
        state.mine = open;
        const here = state.list ? rid(state.list[3]) : '';
        const elsewhere = open.filter(entry => rid(entry[TIMES.list]) !== here);
        $('#mine').hidden = !elsewhere.length;
        $('#mine').innerHTML = elsewhere.length ? `<span class="dot" aria-hidden="true"></span><b>You have ${elsewhere.length} timer${elsewhere.length === 1 ? '' : 's'} running elsewhere:</b>` + elsewhere.map(entry =>
          `<span>${rid(entry[TIMES.list]) ? `<button type="button" class="link" data-open="${esc(rid(entry[TIMES.list]))}">Checklist ${esc(rid(entry[TIMES.list]))}</button>` : 'No checklist'} · ${esc(entry[TIMES.service] || entry[TIMES.category])} · <span class="clock" data-since="${esc(entry[TIMES.start])}" style="font-size:14px">${clock(Date.now() - Number(entry[TIMES.start]))}</span> <button type="button" class="button stop small" data-stop-mine="${esc(rid(entry[3]))}">Stop</button></span>`).join('') : '';
      } catch (ignored) {}
    }
    $('#mine').addEventListener('click', event => {
      const open = event.target.closest('[data-open]'), stop = event.target.closest('[data-stop-mine]');
      if (open) openChecklist(open.dataset.open); else if (stop) stopTimer(stop.dataset.stopMine, stop);
    });

    // ---------- Start ----------
    (async () => {
      if (window.__DEMO_HOST.toLowerCase() !== REALM) { $('#blank').textContent = 'This page reads live Quickbase data. Open it from its Quickbase code page (172) while signed in.'; return; }
      try {
        const doc = await qb('main', {a: 'API_GetUserInfo'}), user = doc.querySelector('user');
        state.me = {id: user?.getAttribute('id') || '', name: `${user?.querySelector('firstName')?.textContent || ''} ${user?.querySelector('lastName')?.textContent || ''}`.trim()};
        await loadServices();
        let wanted = new URLSearchParams(location.search).get('checklist') || '';
        if (!wanted) { try { wanted = localStorage.getItem('cl-testing-last') || ''; } catch (ignored) {} }
        await openChecklist(/^\d+$/.test(wanted) ? wanted : TEST_CHECKLIST);
        if (!state.list) loadMine();
      } catch (error) { say(error.message, 'bad'); }
    })();
  </script>
