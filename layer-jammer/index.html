      <h1>Load a layer list</h1>
      <p class="intro">Paste one item per line, or separate items with commas, semicolons, or tabs. Values are trimmed, deduplicated, and converted to uppercase.</p>
      <label for="layerList">Layers list</label>
      <textarea id="layerList" placeholder="COEX EVOH&#10;MDO HDPE&#10;ACRYLIC MATTE"></textarea>
      <div class="summary"><span><strong id="itemCount">0</strong> unique layers ready</span><span>New rows start with Frequency 1</span></div>
      <div class="preview" id="preview"></div>
      <div class="actions"><button class="primary" id="jamButton" type="button" disabled>Jam layers into Quickbase</button><button class="secondary" id="clearButton" type="button">Clear</button></div>
      <div class="progress" id="progress" hidden><span></span></div>

  <script>
    const QB_REALM = 'demo.quickbase.example';
    const QB_APP = 'bdemoapp0';
    const QB_TABLE = 'bdemolayr';
    const QB_USER_VAR = 'usertoken';
    const QB_APP_VAR = 'q_apptoken';
    const LAYERS_FID = 6;
    const FREQUENCY_FID = 7;
    const CONCURRENCY = 4;
    const qbState = {user:'', app:'', loading:null};
    const input = document.querySelector('#layerList');
    const preview = document.querySelector('#preview');
    const itemCount = document.querySelector('#itemCount');
    const jamButton = document.querySelector('#jamButton');
    const clearButton = document.querySelector('#clearButton');
    const progress = document.querySelector('#progress');
    const progressBar = progress.querySelector('span');
    const status = document.querySelector('#status');
    const details = document.querySelector('#details');

    const esc = value => String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    const clean = value => String(value ?? '').replace(/\s+/g,' ').trim();
    const normalize = value => clean(value).toUpperCase();
    function parsedLayers() {
      return [...new Set(input.value.split(/[\r\n,;\t]+/).map(normalize).filter(Boolean))];
    }
    function renderPreview() {
      const layers = parsedLayers();
      itemCount.textContent = layers.length;
      jamButton.disabled = !layers.length;
      preview.innerHTML = layers.slice(0,100).map(layer => `<span class="chip">${esc(layer)}</span>`).join('');
      status.className = 'status';
      status.textContent = layers.length ? 'Ready to load.' : 'Waiting for a list.';
      details.hidden = true;
    }
    function xml(text) { return new DOMParser().parseFromString(text,'text/xml'); }
    function xmlError(doc) {
      if (doc.querySelector('parsererror')) return 'Quickbase returned malformed XML.';
      const code = clean(doc.querySelector('errcode')?.textContent);
      const message = clean(doc.querySelector('errtext')?.textContent);
      const detail = clean(doc.querySelector('errdetail')?.textContent);
      return code && code !== '0' ? `Quickbase Error ${code}: ${message} ${detail}`.trim() : '';
    }
    function variableApp() {
      const match = location.pathname.match(/^\/(?:db|up)\/([^/?#]+)/i);

    }

      const query = new URLSearchParams({a:'API_GetDBVar',varname:name});

    }
    async function credentials() {
      if (qbState.user && qbState.app) return;
      if (!qbState.loading) qbState.loading = Promise.all([dbVariable(QB_USER_VAR),dbVariable(QB_APP_VAR)]).then(([user,app]) => { qbState.user=user; qbState.app=app; });
      await qbState.loading;
    }
    async function qbCall(parameters) {
      await credentials();
      const query = new URLSearchParams({...parameters,usertoken:qbState.user,apptoken:qbState.app});
      const response = await fetch(`https://${QB_REALM}/db/${QB_TABLE}?${query}`,{credentials:'include'});
      if (!response.ok) throw new Error(`Quickbase request failed (${response.status}).`);
      const doc = xml(await response.text());
      const error = xmlError(doc); if (error) throw new Error(error);
      return doc;
    }
    function recordField(record,fid) {
      const field = [...record.querySelectorAll('f,field')].find(candidate => String(Number(candidate.getAttribute('id') || candidate.getAttribute('fid')) || '') === String(fid));
      return clean(field?.querySelector(':scope > value')?.textContent ?? field?.textContent);
    }
    async function existingLayers() {
      const doc = await qbCall({a:'API_DoQuery',query:'{3.GT.0}',clist:`3.${LAYERS_FID}.${FREQUENCY_FID}`,options:'num-10000',fmt:'structured'});
      const existing = new Map();
      doc.querySelectorAll('record').forEach(record => {
        const value = normalize(recordField(record,LAYERS_FID));
        if (!value || existing.has(value)) return;
        existing.set(value,{rid:recordField(record,3),raw:recordField(record,LAYERS_FID),frequency:Number(recordField(record,FREQUENCY_FID)) || 0});
      });
      return existing;
    }
    async function runPool(tasks,worker) {
      let cursor = 0;
      const runners = Array.from({length:Math.min(CONCURRENCY,tasks.length)},async () => {
        while (cursor < tasks.length) {
          const index = cursor++;
          await worker(tasks[index],index);
        }
      });
      await Promise.all(runners);
    }
    async function jamLayers() {
      const layers = parsedLayers();
      if (!layers.length) return;
      jamButton.disabled = true; clearButton.disabled = true; input.disabled = true;
      progress.hidden = false; progressBar.style.width = '2%';
      status.className = 'status'; status.textContent = 'Reading existing Artwork Searches...';
      details.hidden = true; details.textContent = '';
      try {
        if (window.__DEMO_HOST.toLowerCase() !== QB_REALM) throw new Error('Open this file as a Quickbase code page before loading records.');
        const existing = await existingLayers();
        let created = 0, normalized = 0, unchanged = 0, completed = 0;
        const failures = [];
        await runPool(layers,async layer => {
          try {
            const found = existing.get(layer);
            if (!found) {
              await qbCall({a:'API_AddRecord',[`_fid_${LAYERS_FID}`]:layer,[`_fid_${FREQUENCY_FID}`]:'1'});
              created++;
            } else if (found.raw !== layer || found.frequency < 1) {
              await qbCall({a:'API_EditRecord',rid:found.rid,[`_fid_${LAYERS_FID}`]:layer,[`_fid_${FREQUENCY_FID}`]:String(Math.max(1,found.frequency))});
              normalized++;
            } else unchanged++;
          } catch (error) { failures.push(`${layer}: ${error.message}`); }
          completed++;
          progressBar.style.width = `${Math.round((completed/layers.length)*100)}%`;
          status.textContent = `Processed ${completed} of ${layers.length}...`;
        });
        status.className = failures.length ? 'status error' : 'status';
        status.textContent = `Finished: ${created} created, ${normalized} normalized, ${unchanged} already present, ${failures.length} failed.`;
        if (failures.length) { details.hidden=false; details.textContent=failures.join('\n'); }
      } catch (error) {
        status.className='status error'; status.textContent=error.message;
      } finally {
        jamButton.disabled = !parsedLayers().length; clearButton.disabled=false; input.disabled=false;
      }
    }
    input.addEventListener('input',renderPreview);
    jamButton.addEventListener('click',jamLayers);
    clearButton.addEventListener('click',() => { input.value=''; progress.hidden=true; progressBar.style.width='0'; renderPreview(); input.focus(); });
    renderPreview();
  </script>
